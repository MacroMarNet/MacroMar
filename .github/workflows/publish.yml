name: Render and Publish Quarto Site

on:
  push:
    branches: [ main, master ] # Triggers on pushes to these branches

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Optional: Uncomment the lines below if your Quarto file executes Python code
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-state: 'pip'
      # - run: pip install jupyter jupyterlab

      # Optional: Uncomment the lines below if your Quarto file executes R code
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Install R packages
      #   uses: r-lib/actions/setup-renv@v2

       piety- Check out repository
      - name: Render and Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
